<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuseCanvas · status</title>
<style>
  /* Zero-build dashboard: modern platform features only (no framework,
     no bundler) — the approach GoogleChrome/modern-web-guidance curates.
     Native popover, native dialog, light-dark() color, color-scheme. */
  :root {
    color-scheme: light dark;
    --ok: light-dark(#0a7d33, #4bd073);
    --warn: light-dark(#a05f00, #ffb340);
    --bad: light-dark(#b3261e, #ff6b5e);
    --idle: light-dark(#5f6368, #9aa0a6);
    --go: light-dark(#0b57d0, #8ab4f8);
    --ink: light-dark(#1b1c1d, #e8eaed);
    --dim: light-dark(#5f6368, #9aa0a6);
    --card: light-dark(#ffffff, #1f2023);
    --page: light-dark(#f5f6f7, #101112);
    --line: light-dark(#dadce0, #333537);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px clamp(16px, 4vw, 48px) 48px;
    font: 14px/1.5 ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif;
    background: var(--page); color: var(--ink);
    max-width: 1100px; margin-inline: auto;
  }
  h1 { font-size: 18px; margin: 0 0 2px; letter-spacing: .2px; }
  h1 small { color: var(--dim); font-weight: 400; margin-left: 8px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .stackline { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  #stack-badge {
    font-size: 22px; font-weight: 650; padding: 2px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card);
  }
  #stack-badge[data-phase="running"] { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  #stack-badge[data-phase="degraded"] { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
  #stack-badge[data-phase^="failed"] { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
  #stack-badge[data-phase="booting"], #stack-badge[data-phase="stopping"] { color: var(--go); }
  #stack-detail { color: var(--dim); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font: inherit; padding: 7px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  button:hover { border-color: var(--go); color: var(--go); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--go); border-color: var(--go); color: light-dark(#fff, #101112); font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); color: light-dark(#fff, #101112); }

  #units { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); margin-bottom: 28px; }
  .unit {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; min-height: 92px;
  }
  .unit h3 { margin: 0 0 4px; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; gap: 6px; }
  .unit .port { color: var(--dim); font-weight: 400; font-variant-numeric: tabular-nums; }
  .unit .phase { display: flex; align-items: center; gap: 7px; font-weight: 600; margin-bottom: 4px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--idle); flex: none; }
  .dot.ready { background: var(--ok); }
  .dot.degraded { background: var(--warn); }
  .dot.starting, .dot.stopping { background: var(--go); animation: pulse 1.2s ease-in-out infinite; }
  .dot.failed { background: var(--bad); }
  @keyframes pulse { 50% { opacity: .35; } }
  .unit .detail { color: var(--dim); font-size: 12px; overflow-wrap: anywhere; }
  .unit .pid { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }

  section > h2 { font-size: 14px; margin: 0 0 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .8px; }
  #doctor { display: grid; gap: 8px; }
  .check {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; display: grid;
    grid-template-columns: 92px 1fr; gap: 4px 14px; align-items: baseline;
  }
  .verdict { font-weight: 700; font-size: 12px; letter-spacing: .6px; text-align: center;
    border-radius: 6px; padding: 3px 0; align-self: start; }
  .verdict.passed { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
  .verdict.failed { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); }
  .verdict.untested { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); }
  .check .title { font-weight: 600; }
  .check .evidence { color: var(--dim); grid-column: 2; font-size: 12.5px; overflow-wrap: anywhere; }
  .check .remedy { grid-column: 2; font-size: 12.5px; }
  .check .remedy::before { content: "→ "; color: var(--dim); }
  .check.user .title::after {
    content: "you must do this yourself"; color: var(--warn); font-weight: 500;
    font-size: 11px; margin-left: 8px; border: 1px dashed color-mix(in srgb, var(--warn) 50%, transparent);
    padding: 1px 6px; border-radius: 5px;
  }
  footer { margin-top: 28px; color: var(--dim); font-size: 12px; display: flex; gap: 16px; flex-wrap: wrap; }
  footer a { color: var(--dim); }
  dialog {
    border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink);
    padding: 22px; max-width: 440px;
  }
  dialog::backdrop { background: rgb(0 0 0 / .45); }
  dialog h3 { margin: 0 0 8px; }
  dialog p { color: var(--dim); }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  [data-tooltip] { position: relative; }
</style>
</head>
<body>
<header>
  <div class="stackline">
    <h1>MuseCanvas <small id="version"></small></h1>
    <span id="stack-badge" data-phase="cold">—</span>
    <span id="stack-detail"></span>
  </div>
  <div class="actions">
    <button class="primary" id="open-canvas">Open canvas</button>
    <button id="start">Start</button>
    <button id="stop">Stop</button>
    <button id="rerun-doctor">Re-run doctor</button>
    <button id="reveal-data" title="Show the data folder in Finder">Data folder</button>
    <button id="reveal-logs" title="Show service logs in Finder">Logs</button>
  </div>
</header>

<section id="units" aria-label="services"></section>

<section>
  <h2>Doctor — passed / failed / untested</h2>
  <div id="doctor"></div>
</section>

<footer>
  <span id="stamp"></span>
  <a href="/status.json">status.json</a>
  <a href="/doctor.json">doctor.json</a>
  <span>loopback only · keys never included</span>
</footer>

<dialog id="confirm-dialog">
  <h3 id="confirm-title"></h3>
  <p id="confirm-body"></p>
  <div class="row">
    <button id="confirm-no">Cancel</button>
    <button class="primary" id="confirm-yes">Stop everything</button>
  </div>
</dialog>

<script type="module">
"use strict";
const $ = (id) => document.getElementById(id);

async function getJSON(path) {
  const res = await fetch(path, { cache: "no-store" });
  if (!res.ok) throw new Error(`${path}: HTTP ${res.status}`);
  return res.json();
}

async function action(name) {
  const res = await fetch(`/action/${name}`, { method: "POST" });
  return res.json();
}

function renderUnits(units) {
  $("units").replaceChildren(...units.map((u) => {
    const card = document.createElement("article");
    card.className = "unit";
    const head = document.createElement("h3");
    head.append(
      Object.assign(document.createElement("span"), { textContent: u.title }),
      Object.assign(document.createElement("span"), { className: "port", textContent: `:${u.port}` }),
    );
    const phase = document.createElement("div");
    phase.className = "phase";
    phase.append(
      Object.assign(document.createElement("span"), { className: `dot ${u.phase.split(":")[0]}` }),
      Object.assign(document.createElement("span"), { textContent: u.phase }),
    );
    const detail = Object.assign(document.createElement("div"), { className: "detail", textContent: u.detail });
    card.append(head, phase, detail);
    if (u.pid) {
      card.append(Object.assign(document.createElement("div"), { className: "pid", textContent: `pid ${u.pid}` }));
    }
    return card;
  }));
}

function renderDoctor(report) {
  $("doctor").replaceChildren(...report.checks.map((c) => {
    const row = document.createElement("article");
    row.className = "check" + (c.userActionRequired ? " user" : "");
    const verdict = Object.assign(document.createElement("span"),
      { className: `verdict ${c.verdict}`, textContent: c.verdict.toUpperCase() });
    const title = Object.assign(document.createElement("span"), { className: "title", textContent: c.title });
    const evidence = Object.assign(document.createElement("div"), { className: "evidence", textContent: c.evidence });
    row.append(verdict, title, evidence);
    if (c.remedy) {
      row.append(Object.assign(document.createElement("div"), { className: "remedy", textContent: c.remedy }));
    }
    return row;
  }));
}

async function refresh() {
  try {
    const s = await getJSON("/status.json");
    const phase = s.stack.split(":")[0];
    $("stack-badge").textContent = phase;
    $("stack-badge").dataset.phase = phase;
    $("stack-detail").textContent = s.stackDetail;
    $("version").textContent = "";
    renderUnits(s.units);
    $("stamp").textContent = `updated ${new Date(s.generatedAtUnix * 1000).toLocaleTimeString()}`;
    $("start").disabled = phase === "running" || phase === "booting";
    $("stop").disabled = phase === "cold" || phase === "stopped";
  } catch (e) {
    $("stack-detail").textContent = `status unavailable (${e.message})`;
  }
  try {
    renderDoctor(await getJSON("/doctor.json"));
  } catch { /* doctor follows status */ }
}

const dialog = $("confirm-dialog");
function confirmStop() {
  $("confirm-title").textContent = "Stop all five services?";
  $("confirm-body").textContent =
    "Media already generated is kept. A Doubao task already running in the background will finish on its own (upstream behavior).";
  dialog.showModal();
}
$("confirm-yes").onclick = async () => {
  dialog.close();
  $("stop").disabled = true;
  $("stack-detail").textContent = "stopping…";
  await action("stop");
  refresh();
};
$("confirm-no").onclick = () => dialog.close();

$("stop").onclick = confirmStop;
$("start").onclick = async () => {
  $("start").disabled = true;
  $("stack-detail").textContent = "starting… (first boot can take a minute)";
  await action("start");
  refresh();
};
$("open-canvas").onclick = () => action("open-canvas");
$("reveal-data").onclick = () => action("reveal-data");
$("reveal-logs").onclick = () => action("reveal-logs");
$("rerun-doctor").onclick = async () => {
  $("rerun-doctor").disabled = true;
  await action("doctor");
  $("rerun-doctor").disabled = false;
  refresh();
};

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
